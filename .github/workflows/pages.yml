name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage allowlisted Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/team-destiny-pages"
          mkdir -p "$stage/assets"

          files=(
            CNAME index.html styles.css script.js favicon.ico
            site.webmanifest robots.txt sitemap.xml
            assets/destiny-logo-black.jpg
            assets/destiny-logo-white.jpg
            assets/team-destiny-icon-180.png
            assets/team-destiny-icon-192.png
            assets/team-destiny-icon-512.png
            assets/team-destiny-share.png
          )

          for file in "${files[@]}"; do
            test -f "$file" && test ! -L "$file"
          done

          install -m 0644 \
            CNAME index.html styles.css script.js favicon.ico \
            site.webmanifest robots.txt sitemap.xml \
            "$stage/"
          install -m 0644 \
            assets/destiny-logo-black.jpg \
            assets/destiny-logo-white.jpg \
            assets/team-destiny-icon-180.png \
            assets/team-destiny-icon-192.png \
            assets/team-destiny-icon-512.png \
            assets/team-destiny-share.png \
            "$stage/assets/"

          expected="$(printf '%s\n' \
            CNAME index.html styles.css script.js favicon.ico \
            site.webmanifest robots.txt sitemap.xml \
            assets/destiny-logo-black.jpg \
            assets/destiny-logo-white.jpg \
            assets/team-destiny-icon-180.png \
            assets/team-destiny-icon-192.png \
            assets/team-destiny-icon-512.png \
            assets/team-destiny-share.png | LC_ALL=C sort)"
          actual="$(find "$stage" -type f -print | sed "s#^$stage/##" | LC_ALL=C sort)"
          test "$actual" = "$expected"
          test -z "$(find "$stage" -type l -print -quit)"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/team-destiny-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
